    - DELETE https://api.axiom.co/v1/datasets/{id}
    - POST   https://api.axiom.co/v1/datasets/{id}/trim
    - POST   https://api.axiom.co/v1/datasets/{id}/ingest
    - POST   https://api.axiom.co/v1/datasets/{id}/query
    - POST   https://api.axiom.co/v1/datasets/_apl
    - GET    https://api.axiom.co/v2/annotations
    - POST   https://api.axiom.co/v2/annotations
    - GET    https://api.axiom.co/v2/monitors
    - GET    https://api.axiom.co/v2/notifiers
    - GET    https://api.axiom.co/v2/dashboards
    - GET    https://api.axiom.co/v2/vfields
    - GET    https://api.axiom.co/v2/tokens
  endpointsModeledRest:
    - GET    https://api.axiom.co/v1/datasets/{id}/fields
    - GET    https://api.axiom.co/v1/datasets/{id}/fields/{fieldName}
    - PUT    https://api.axiom.co/v1/datasets/{id}/fields/{fieldName}
    - GET    https://api.axiom.co/v1/user
    - GET    https://api.axiom.co/v1/orgs
    - GET    https://api.axiom.co/v1/orgs/{orgId}
    - PUT    https://api.axiom.co/v1/orgs/{orgId}
    - GET/PUT/DELETE https://api.axiom.co/v2/annotations/{id}
    - POST/GET/PUT/DELETE https://api.axiom.co/v2/monitors and /v2/monitors/{id}
    - GET    https://api.axiom.co/v2/monitors/{id}/history
    - POST/GET/PUT/DELETE https://api.axiom.co/v2/notifiers and /v2/notifiers/{id}
    - POST/GET/PUT/DELETE https://api.axiom.co/v2/dashboards and /v2/dashboards/{id}
    - POST/GET/PUT/DELETE https://api.axiom.co/v2/vfields and /v2/vfields/{id}
    - POST/GET/PUT/DELETE https://api.axiom.co/v2/starred and /v2/starred/{id}
    - POST/GET/DELETE https://api.axiom.co/v2/tokens and /v2/tokens/{id}
