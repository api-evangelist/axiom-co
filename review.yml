aid: axiom-co
name: Axiom
review:
  question: Does Axiom expose a documented public WebSocket API?
  answer: false
  date: '2026-07-02'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Under the updated API Evangelist scope
    (2026-05-29), HTTP Server-Sent Events (SSE) is in-scope for AsyncAPI
    modeling, but Axiom's public REST API does not document an SSE (or any
    server-push) transport. Ingest is a request/response POST, and both the APL
    query endpoint (POST /v1/datasets/_apl) and the legacy query endpoint
    (POST /v1/datasets/{id}/query) return a single complete JSON result body -
    they are not streamed. The live-tail / "stream" experience in the Axiom
    console is a UI feature layered over repeated calls to the query API, not a
    documented public SSE or WebSocket endpoint. Because there is no
    server-push transport on Axiom's own public API to model, no AsyncAPI spec
    was created.
findings:
  summary: |
    Axiom does not publish a documented public WebSocket API. Axiom is a log
    management, event data, and observability platform. Its public API is a
    REST/HTTPS API under https://api.axiom.co (US region) or
    https://api.eu.axiom.co (EU region), split into a v1 endpoint family
    (datasets, ingest, APL query, fields, current user) and a v2 endpoint family
    (annotations, monitors, notifiers, dashboards, virtual fields, starred
    queries, tokens, users). Authentication is a Bearer token - either a scoped
    API token or a Personal Access Token (PAT); PAT requests additionally send
    an x-axiom-org-id header. Ingest is request/response POST (JSON array,
    NDJSON, or CSV), with a lower-latency edge ingest endpoint on
    *.edge.axiom.co. Querying is request/response POST of an APL statement
    returning tabular or legacy JSON. No realtime, bidirectional, or streaming
    WebSocket (ws:// or wss://) endpoint - and no documented public SSE stream -
    is described anywhere in Axiom's API reference.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.axiom.co
      documented: true
      note: v1 and v2 endpoint families. EU region base is https://api.eu.axiom.co.
    - protocol: REST (Edge Ingest)
      scheme: https
      baseURL: https://{edge-deployment}.edge.axiom.co/v1/ingest/{DATASET_NAME}
      documented: true
      note: Lower-latency ingest endpoint (e.g. us-east-1.aws.edge.axiom.co, eu-central-1.aws.edge.axiom.co). Still request/response HTTP POST.
    - protocol: SSE
      scheme: https
      documented: false
      note: No documented public Server-Sent Events stream. The console live-tail is a UI feature over the query API, not a documented SSE endpoint.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Axiom's REST API reference, ingest, query, or any product page as of the review date.
