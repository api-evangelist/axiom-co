sources:
  - url: https://axiom.co/docs/restapi/introduction
    type: Documentation
    note: Base domains (api.axiom.co / api.eu.axiom.co), Bearer auth, API tokens vs PATs (x-axiom-org-id), v1 and v2 families. No WebSocket mentioned.
  - url: https://axiom.co/docs/restapi/endpoints
    type: APIReference
    note: Endpoint reference index; all documented operations are HTTPS REST.
  - url: https://axiom.co/docs/restapi/ingest
    type: Documentation
    note: Ingest is POST (JSON/NDJSON/CSV) to /v1/datasets/{id}/ingest plus an edge ingest endpoint. Request/response, not WebSocket.
  - url: https://axiom.co/docs/restapi/query
    type: Documentation
    note: APL query is POST /v1/query/_apl (also /v1/datasets/_apl) returning a single JSON result. No streaming, SSE, or WebSocket documented.
  - url: https://axiom.co/docs/restapi/api-limits
    type: Documentation
    note: Three limit categories (general/query/ingest) with X-RateLimit-*, X-QueryLimit-*, X-IngestLimit-* headers and 429 responses. All over REST.
  - url: https://axiom.co/docs/reference/tokens
    type: Documentation
    note: API tokens (basic ingest-only, advanced query/manage) vs Personal Access Tokens (full access, require org ID).
  - url: https://github.com/axiomhq
    type: SourceCode
    note: Official SDKs (axiom-go, axiom-py) and MCP server; all clients are HTTP/REST against api.axiom.co.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and no documented public SSE stream
    exists either. Axiom's own public API is request/response REST across its
    v1 and v2 endpoint families (ingest, APL query, datasets, fields,
    annotations, monitors, notifiers, dashboards, virtual fields, starred
    queries, tokens, users, orgs). No AsyncAPI document was created because
    there is no server-push transport on Axiom's own API to model - the console
    live-tail is a UI feature over the query API, not a documented streaming
    endpoint.
