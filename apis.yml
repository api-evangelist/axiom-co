aid: axiom-co

url: https://raw.githubusercontent.com/api-evangelist/axiom-co/refs/heads/main/apis.yml

name: Axiom

kind: company

description: Axiom is a log management, event data, and observability platform that ingests, stores, and queries large volumes of logs, traces,
  and events at low cost. Data is loaded into datasets and queried with the Axiom Processing Language (APL). The REST API (base https://api.axiom.co,
  US region; https://api.eu.axiom.co for EU) exposes ingest, APL query, datasets, fields, annotations, monitors, notifiers, dashboards, virtual
  fields, starred queries, API tokens, users, and organizations, with v1 and v2 endpoint families and Bearer token authentication.

