aid: axiom-co
url: https://raw.githubusercontent.com/api-evangelist/axiom-co/refs/heads/main/apis.yml
name: Axiom
kind: company
description: Axiom is a log management, event data, and observability platform that
  ingests, stores, and queries large volumes of logs, traces, and events at low cost.
  Data is loaded into datasets and queried with the Axiom Processing Language (APL).
  The REST API (base https://api.axiom.co, US region; https://api.eu.axiom.co for EU)
  exposes ingest, APL query, datasets, fields, annotations, monitors, notifiers,
  dashboards, virtual fields, starred queries, API tokens, users, and organizations,
  with v1 and v2 endpoint families and Bearer token authentication.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Observability
- Log Management
- Event Data
- Logs
- Tracing
- Analytics
- APL
created: '2026-07-02'
modified: '2026-07-02'
specificationVersion: '0.19'
