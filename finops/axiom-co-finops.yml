meters:
- name: data_loaded
  description: Data loaded (ingested) into datasets, billed per GB (in credits) above the free allowance.
  unit: bytes
  aggregation: sum
  dimensions:
  - organization
  - dataset
- name: query_compute
  description: Compute consumed running APL and legacy queries, metered in GB-hours / GB*ms.
  unit: gb_hours
  aggregation: sum
  dimensions:
  - organization
  - dataset
- name: storage
  description: Volume of event data retained in datasets, billed per GB stored.
  unit: bytes
  aggregation: sum
  dimensions:
  - organization
  - dataset
principles:
- name: Visibility
  description: >-
    Track GB loaded, query compute, and stored volume per dataset; read the
    X-IngestLimit-* and X-QueryLimit-* response headers to monitor consumption
    against plan allowances in real time.
- name: Allocation
  description: >-
    Separate datasets per team, service, or environment so ingest, query, and
    storage spend maps cleanly to internal cost centers.
- name: Optimization
  description: >-
    Reduce ingest by dropping or sampling noisy fields/events before loading;
    scope APL queries by dataset and time range to cut query compute; trim and
    vacuum datasets and tune retention to control stored volume. Lean on
    automatic volume discounts at high ingest.
- name: Accountability
  description: >-
    Assign dataset owners and review monthly data-loaded, query-compute, and
    storage against Personal/Team allowances or the Enterprise agreement.
