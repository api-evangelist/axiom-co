description: >-
  FinOps view of Axiom spend. Axiom is an observability platform billed on
  usage, driven primarily by the volume of data loaded (ingested) into datasets,
  the query compute consumed running APL queries, and the volume of data stored.
  The REST API and MCP server carry no separate per-call fee - cost is a function
  of GB ingested, GB-hours (or GB*ms) of query compute, and GB stored. A free
  Personal allowance covers small usage; the Team tier is usage-based with
  automatic volume discounts on data loaded; Enterprise agreements cover
  high-volume, EU-region, and AWS Marketplace billing arrangements. The dominant
  optimization levers are what you ingest (drop or sample noisy fields/events
  before loading), how you query (scope APL time ranges and datasets), and
  retention (trim/vacuum datasets to control stored volume).
notes: >-
  Per-unit credit rates and query-compute pricing change with Axiom's
  usage-based model; verify current rates on the Axiom pricing page. Ingest and
  query allowances and consumption are also observable at runtime via the
  X-IngestLimit-* and X-QueryLimit-* response headers, which support programmatic
  cost/quota tracking.
